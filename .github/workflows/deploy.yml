name: Deploy to EC2

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0bab25e4f0bff8a1d \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 35.175.135.72
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd /home/ec2-user/travyl-backend-prod
              git pull origin main
              source venv/bin/activate
              pip install -r requirements.txt
              sudo systemctl restart travyl-api-prod
            else
              cd /home/ec2-user/travyl-backend-dev
              git pull origin develop
              source venv/bin/activate
              pip install -r requirements.txt
              sudo systemctl restart travyl-api-dev
            fi

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-0bab25e4f0bff8a1d \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
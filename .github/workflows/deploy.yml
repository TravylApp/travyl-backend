name: Deploy to EC2

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0bab25e4f0bff8a1d \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 35.175.135.72
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" = "main" ]; then
              DEPLOY_DIR=/home/ec2-user/travyl-backend-prod
              BRANCH=main
              SERVICE=travyl-api-prod
              SECRET_NAME=travyl/prod
            else
              DEPLOY_DIR=/home/ec2-user/travyl-backend-dev
              BRANCH=develop
              SERVICE=travyl-api-dev
              SECRET_NAME=travyl/staging
            fi

            cd $DEPLOY_DIR
            git fetch origin $BRANCH
            git checkout $BRANCH
            git reset --hard origin/$BRANCH
            source venv/bin/activate
            pip install -r requirements.txt

            # single env var tells the app which secret to load
            echo "AWS_SECRET_NAME=${SECRET_NAME}" > .env
            chmod 600 .env

            sudo systemctl restart $SERVICE

      - name: Verify deployment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            URL="https://api.gotravyl.com/health"
          else
            URL="https://api.dev.gotravyl.com/health"
          fi
          echo "Checking $URL ..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL")
          echo "Health check returned: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Deployment health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-0bab25e4f0bff8a1d \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
